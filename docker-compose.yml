services:
  postgres:
    image: postgres:16
    container_name: cognify-postgres
    restart: always
    environment:
      POSTGRES_USER: cognify
      POSTGRES_PASSWORD: cognify_password
      POSTGRES_DB: cognify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: