<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cognify is offline</title>
    <meta name="theme-color" content="#0f172a" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(37, 99, 235, 0.35),
            transparent 35%
          ),
          linear-gradient(135deg, #020617 0%, #0f172a 55%, #111827 100%);
        color: #e5e7eb;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(520px, 100%);
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.86);
        border-radius: 28px;
        padding: 32px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 24px;
        display: grid;
        place-items: center;
        background: #2563eb;
        color: white;
        font-size: 34px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 8vw, 42px);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.65;
        font-size: 16px;
      }

      .hint {
        margin-top: 22px;
        color: #93c5fd;
        font-size: 14px;
      }

      button {
        margin-top: 28px;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: #2563eb;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">C</div>
      <h1>You are offline</h1>
      <p>
        Cognify cannot reach the internet right now. Reconnect to continue your
        AI chat conversations.
      </p>
      <p class="hint">
        Turn off airplane mode or connect to Wi-Fi/mobile data, then try again.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
